<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agent-office-token" content="__PAGE_TOKEN__">
<title>Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b1d24;
  --wall: #262a35;
  --wall-2: #2e3340;
  --floor-a: #6b4a32;
  --floor-b: #62432d;
  --room-border: #12141a;
  --text: #eef0f5;
  --muted: #a3a9b8;
  --faint: #6f7686;
  --panel: #232731;
  --panel-2: #2b303c;
  --line: #3a4050;
  --board: #f6f5f0;
  --board-ink: #2a2d35;
  --board-frame: #9aa0ab;
  --cork: #b98a5a;
  --cork-dark: #a47748;
  --todo: #fde68a;
  --doing: #bfdbfe;
  --done: #bbf7d0;
  --working: #4ade80;
  --needs: #fbbf24;
  --needs-strong: #f59e0b;
  --turn: #60a5fa;
  --ended: #6b7280;
  --table: #c8a27a;
  --table-edge: #8a6a4a;
  --chair: #3f4a5c;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --pixel: 'Silkscreen', ui-monospace, monospace;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9e6df; --wall: #f3f1ec; --wall-2: #e4e0d6; --floor-a: #d9b98f; --floor-b: #d1b085;
    --room-border: #b9ad98; --text: #1f2230; --muted: #555c6c; --faint: #8a90a0; --panel: #ffffff;
    --panel-2: #f5f3ee; --line: #ddd7cb; --shadow: 0 8px 24px rgba(60,40,10,.14); --chair: #6b7890;
  }
}
:root[data-theme="light"] {
  --bg: #e9e6df; --wall: #f3f1ec; --wall-2: #e4e0d6; --floor-a: #d9b98f; --floor-b: #d1b085;
  --room-border: #b9ad98; --text: #1f2230; --muted: #555c6c; --faint: #8a90a0; --panel: #ffffff;
  --panel-2: #f5f3ee; --line: #ddd7cb; --shadow: 0 8px 24px rgba(60,40,10,.14); --chair: #6b7890;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ── Top bar ───────────────────────────────── */
.topbar {
  height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: var(--wall); border-bottom: 3px solid var(--room-border);
}
.brand { font: 16px var(--pixel); letter-spacing: .5px; white-space: nowrap; }
.brand small { font: 11px var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.counts { display: flex; gap: 8px; }
.count { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); font-weight: 600; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.working { background: var(--working); box-shadow: 0 0 0 3px color-mix(in srgb, var(--working) 25%, transparent); }
.dot.needs_you { background: var(--needs); box-shadow: 0 0 0 3px color-mix(in srgb, var(--needs) 30%, transparent); }
.dot.your_turn { background: var(--turn); }
.dot.ended { background: var(--ended); }
.inbox { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.inbox::-webkit-scrollbar { display: none; }
.ask {
  display: flex; align-items: center; gap: 8px; max-width: 420px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: color-mix(in srgb, var(--needs) 18%, var(--panel)); border: 1px solid color-mix(in srgb, var(--needs) 55%, transparent);
  white-space: nowrap; overflow: hidden;
}
.ask b { font-weight: 700; }
.ask span { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.ask.turn { background: color-mix(in srgb, var(--turn) 14%, var(--panel)); border-color: color-mix(in srgb, var(--turn) 45%, transparent); }
.live { font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.iconbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }

/* ── Layout ───────────────────────────────── */
.office { display: flex; height: calc(100% - 56px); }
.backlog {
  width: 300px; flex: none; overflow-y: auto; padding: 14px 12px 40px;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.06) 1px, transparent 1.5px) 0 0/9px 9px,
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.07) 1px, transparent 1.5px) 0 0/11px 11px,
    var(--cork);
  border-right: 6px solid var(--table-edge);
}
.backlog h2 { font: 13px var(--pixel); margin: 2px 4px 10px; color: #3b2612; display: flex; justify-content: space-between; align-items: center; }
.backlog h2 button { font: 11px var(--sans); background: rgba(255,255,255,.55); border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; color: #3b2612; }
.repo { margin-bottom: 16px; }
.repo-name { font: 11px var(--pixel); color: #3b2612; margin: 8px 4px 6px; display: flex; justify-content: space-between; }
.repo-err { background: rgba(255,255,255,.7); color: #7a2e0e; padding: 8px 10px; border-radius: 4px; font-size: 12px; margin: 0 4px 8px; }
.subhead { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #4a3218; margin: 10px 4px 5px; }
.card {
  position: relative; display: block; text-decoration: none; background: #fffdf6; color: #2a2d35;
  margin: 0 4px 7px; padding: 7px 9px 7px 11px; border-radius: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.18);
  transform: rotate(var(--tilt, 0deg)); transition: transform .15s;
}
.card:hover { transform: rotate(0) scale(1.02); }
.card::before { content: ''; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border-radius: 50%; background: #d94c3d; box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.card .iid { font: 10px var(--pixel); color: #7b6a55; }
.card .t { font-weight: 600; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.labels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.label { font-size: 10px; padding: 0 5px; border-radius: 3px; background: #efe8d8; color: #6b5a42; }
.card.taken { background: #eaf3ff; outline: 2px solid var(--turn); }
.card.taken.s-working { outline-color: var(--working); background: #ecfdf3; }
.card.taken.s-needs_you { outline-color: var(--needs-strong); background: #fff7e6; }
.desk-tag { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11px; font-weight: 600; color: #334155; }

.floor { flex: 1; overflow: auto; padding: 18px 22px 60px; }
.room { margin-bottom: 26px; }
.room-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px 2px; }
.room-head h3 { font: 14px var(--pixel); margin: 0; }
.room-head span { color: var(--muted); font-size: 12px; }
.room-floor {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; padding: 22px;
  border: 6px solid var(--room-border); border-radius: 4px;
  background: repeating-linear-gradient(0deg, var(--floor-a) 0 22px, var(--floor-b) 22px 24px);
}
.room.cowork .room-floor { background: repeating-conic-gradient(#8fa3b8 0 25%, #a7b8ca 0 50%) 0 0/36px 36px; }
.room.dormant .room-head h3 { color: var(--muted); }
.dorm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.dorm {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; opacity: .82;
}
.dorm:hover { opacity: 1; border-color: var(--turn); }
.dorm .sprite { position: static; transform: none; flex: none; opacity: .75; }
.dorm.gone .sprite { opacity: .35; filter: grayscale(1); }
.dorm .grow { flex: 1; min-width: 0; }
.dorm-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dorm-head b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dorm-head b::first-letter { text-transform: uppercase; }
.dorm-when { color: var(--faint); font-size: 11px; margin-left: auto; white-space: nowrap; }
.dorm-note { color: var(--muted); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dorm-tasks { color: var(--faint); font-size: 11px; white-space: nowrap; }
.empty { color: var(--muted); padding: 60px 20px; text-align: center; font-size: 14px; }
.empty b { font: 14px var(--pixel); display: block; margin-bottom: 8px; color: var(--text); }

/* ── Pod ───────────────────────────────── */
.pod { position: relative; cursor: pointer; border-radius: 6px; padding: 0 0 10px; transition: transform .12s; }
.pod:hover { transform: translateY(-2px); }
.pod.s-needs_you::after {
  content: ''; position: absolute; inset: -8px; border-radius: 10px; pointer-events: none;
  border: 3px solid var(--needs); animation: pulse 1.6s ease-in-out infinite;
}
.pod.s-ended { filter: grayscale(.8) brightness(.8); }
@keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

.board {
  background: var(--board); color: var(--board-ink); border: 5px solid var(--board-frame); border-radius: 3px;
  box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 8px 9px 9px; position: relative;
}
.board::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -12px; height: 5px; background: var(--board-frame); border-radius: 0 0 3px 3px; }
.board-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; min-width: 0; }
.board-title { font-weight: 700; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.board-title::first-letter { text-transform: uppercase; }
.chip { font: 10px var(--pixel); padding: 2px 5px; border-radius: 3px; background: #e0e7ff; color: #3730a3; text-decoration: none; white-space: nowrap; }
.chip.proj { background: #ececec; color: #555; }
.chip.agent { background: color-mix(in srgb, var(--agent) 20%, transparent); color: var(--agent); border: 1px solid color-mix(in srgb, var(--agent) 45%, transparent); }
.dorm .chip.agent { font-size: 9px; }
.board-head .sp { flex: 1; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.col h4 { margin: 0 0 4px; font: 9.5px var(--pixel); color: #6b7280; display: flex; justify-content: space-between; }
.note { font-size: 10.5px; line-height: 1.25; padding: 4px 5px; margin-bottom: 4px; border-radius: 1px; box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.note span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note.pending { background: var(--todo); }
.note.in_progress { background: var(--doing); }
.note.completed { background: var(--done); color: #3f5f48; }
.more { font-size: 10px; color: #6b7280; padding-left: 2px; }
.noboard { font-size: 11.5px; color: #6b7280; padding: 6px 2px 4px; font-style: italic; }

.desk { position: relative; height: 170px; margin-top: 14px; }
.table { position: absolute; left: 92px; right: 26px; top: 58px; height: 58px; background: var(--table); border-radius: 6px; border-bottom: 6px solid var(--table-edge); box-shadow: 0 6px 10px rgba(0,0,0,.25); }
.seat { position: absolute; width: 40px; height: 52px; transform: translate(-50%, 0); }
.chair { position: absolute; left: 50%; transform: translateX(-50%); width: 30px; height: 26px; background: var(--chair); border-radius: 6px 6px 3px 3px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.seat.top .chair { top: 4px; }
.seat.bottom .chair { bottom: -2px; }
.seat.head .chair { top: 10px; }
.sprite { position: absolute; left: 50%; transform: translateX(-50%); image-rendering: pixelated; }
.seat.top .sprite { top: -6px; }
.seat.bottom .sprite { top: 2px; }
.seat.head .sprite { top: -4px; }
.seat.done .sprite { opacity: .45; }
.seat.done::after { content: '✓'; position: absolute; right: -2px; top: -8px; font-size: 11px; font-weight: 800; color: #fff; background: #22a55a; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
.seat.failed::after { content: '!'; background: #dc2626; position: absolute; right: -2px; top: -8px; font-size: 11px; font-weight: 800; color: #fff; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
.seat.working .sprite { animation: type .5s steps(2) infinite; }
@keyframes type { 50% { transform: translate(-50%, -1.5px); } }
.laptop { position: absolute; width: 22px; height: 14px; transform: translateX(-50%); background: #2d3340; border-radius: 2px; border: 2px solid #5b6275; }
.laptop.on { background: #7dd3fc; animation: flicker 1.2s steps(3) infinite; }
@keyframes flicker { 33% { background: #93e0ff } 66% { background: #6cc4ee } }
.laptop.alert { background: var(--needs); animation: none; }
.plus { position: absolute; right: 30px; bottom: 6px; font: 10px var(--pixel); background: var(--panel); padding: 2px 6px; border-radius: 4px; }
.bubble {
  position: absolute; left: 44px; top: 2px; transform: translateX(-50%); min-width: 26px; height: 26px; padding: 0 7px;
  border-radius: 13px; display: grid; place-items: center; font: 13px var(--pixel); color: #1f2230; background: #fff;
  box-shadow: 0 2px 0 rgba(0,0,0,.25); z-index: 3;
}
.bubble::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bubble.needs_you { background: var(--needs); animation: bounce 1s ease-in-out infinite; }
.bubble.needs_you::after { border-top-color: var(--needs); }
.bubble.your_turn { background: #dbeafe; }
.bubble.your_turn::after { border-top-color: #dbeafe; }
.bubble.working { font-size: 10px; letter-spacing: 1px; }
.bubble.ended { background: #e5e7eb; font-size: 10px; }
@keyframes bounce { 50% { transform: translate(-50%, -4px); } }

.plate { margin-top: 2px; background: var(--panel); border-radius: 6px; padding: 8px 10px; box-shadow: var(--shadow); }
.plate-status { display: flex; align-items: flex-start; gap: 7px; font-weight: 600; }
.plate-status .dot { margin-top: 5px; }
.plate-status .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.plate-meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.plate-meta code { font: 11px ui-monospace, monospace; }
.waiting-box { margin-top: 6px; padding: 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--needs) 16%, transparent); border-left: 3px solid var(--needs); font-size: 12px; }
.waiting-box.turn { background: color-mix(in srgb, var(--turn) 12%, transparent); border-left-color: var(--turn); }
.waiting-box .q { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 280px; background: #111827; color: #f3f4f6; padding: 7px 9px; border-radius: 6px; font-size: 12px; box-shadow: var(--shadow); display: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip i { color: #9ca3af; font-style: normal; }

/* ── Drawer ───────────────────────────────── */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); box-shadow: -10px 0 30px rgba(0,0,0,.35); transform: translateX(105%); transition: transform .2s ease; z-index: 40; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-head h2 { margin: 0; font-size: 17px; flex: 1; }
.drawer-head h2::first-letter { text-transform: uppercase; }
.drawer-body { flex: 1; min-height: 0; padding: 6px 18px 40px; overflow-y: auto; }
.sec { margin-top: 16px; }
.sec h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.quote { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row small { color: var(--muted); display: block; }
.st { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.st.pending { background: var(--todo); color: #6b5100; }
.st.in_progress { background: var(--doing); color: #1e3a8a; }
.st.completed, .st.done { background: var(--done); color: #14532d; }
.st.running { background: #dcfce7; color: #166534; }
.st.failed { background: #fee2e2; color: #991b1b; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12px; }
.kv div:nth-child(odd) { color: var(--muted); }
.kv code { font: 11.5px ui-monospace, monospace; word-break: break-all; }
.copy { display: flex; gap: 6px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; font: 12px ui-monospace, monospace; }
.copy code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy button { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-family: var(--sans); }
.convo { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; }
.convo h5 { display: flex; justify-content: space-between; align-items: center; }
.convo h5 button { font: 11px var(--sans); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; text-transform: none; letter-spacing: 0; }
.msgs { max-height: 46vh; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; }
.msg { font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; border-radius: 8px; padding: 8px 10px; }
.msg.user { background: color-mix(in srgb, var(--turn) 16%, var(--panel-2)); margin-left: 24px; }
.msg.assistant { background: var(--panel-2); }
.msg.tool { background: transparent; color: var(--faint); font: 11.5px ui-monospace, monospace; padding: 0 2px; white-space: pre-wrap; }
.msg .who { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 3px; }
.msg-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.actions button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; font-size: 12px; font-weight: 600; }
.actions button.primary { background: color-mix(in srgb, var(--needs) 22%, var(--panel)); border-color: color-mix(in srgb, var(--needs) 55%, transparent); }
.actions button:hover { border-color: var(--turn); }
.hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.hint.err { color: var(--needs); }
.drawer-foot { border-top: 1px solid var(--line); padding: 10px 18px 14px; background: var(--panel); }
.drawer-foot:empty { display: none; }
.drawer-foot textarea { display: block; width: 100%; box-sizing: border-box; resize: vertical; min-height: 56px; max-height: 30vh; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 13px/1.4 var(--sans); }
.drawer-foot textarea:focus { outline: none; border-color: var(--turn); }
.foot-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.foot-row .hint { margin-top: 0; }
.foot-row button { flex: none; background: color-mix(in srgb, var(--turn) 22%, var(--panel)); border: 1px solid color-mix(in srgb, var(--turn) 55%, transparent); color: var(--text); border-radius: 7px; padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 600; }
.foot-row button:disabled { opacity: .5; cursor: default; }
.detail { font: 11.5px ui-monospace, monospace; background: #111827; color: #e5e7eb; padding: 7px 9px; border-radius: 5px; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }

@media (max-width: 760px) {
  .backlog { display: none; }
  .room-floor { grid-template-columns: 1fr; padding: 12px; }
  .inbox { display: none; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Agent Office<small id="sub"></small></div>
  <div class="counts" id="counts"></div>
  <div class="inbox" id="inbox"></div>
  <div class="live" id="live"></div>
  <button class="iconbtn" id="theme" title="Toggle light/dark">◐</button>
</div>
<div class="office">
  <aside class="backlog" id="backlog"></aside>
  <main class="floor" id="floor"></main>
</div>
<aside class="drawer" id="drawer"><div class="drawer-head" id="dhead"></div><div class="drawer-body" id="dbody"></div><div class="drawer-foot" id="dfoot"></div></aside>
<div class="tip" id="tip"></div>

<script>
'use strict';
let state = { sessions: [], backlog: [], now: Date.now() };
let openId = null;
const podCache = new Map();

// ── helpers ─────────────────────────────────
// Actions carry the page's own token; the server refuses POSTs without it
const PAGE_TOKEN = document.querySelector('meta[name="agent-office-token"]').content;
const action = (url, body) =>
  fetch(url, {
    method: 'POST',
    headers: { 'X-Agent-Office-Token': PAGE_TOKEN, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function hash(str) { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const ORDER = { needs_you: 0, working: 1, your_turn: 2, ended: 3 };
const STATUS_LABEL = { working: 'Working', needs_you: 'Needs you', your_turn: 'Your turn', ended: 'Gone home' };
// A "your turn" session untouched for 30+ min is parked rather than waiting.
function effStatus(s) { return s.status; }
function isParked(s) { return s.status === 'your_turn' && Date.now() - s.lastActivity > 30 * 60_000; }

// ── pixel sprites (original, generic office folk) ─────────────
const SKIN = ['#f1c7a5', '#e0ac85', '#c68863', '#9a6444', '#6e4630', '#f5d6bd'];
const HAIR = ['#2b1d14', '#5a3a22', '#8b5a2b', '#d1a45b', '#1c1c1c', '#a33b20', '#7d7d86', '#e8d7a8'];
const TYPE_SHIRT = { 'Explore': '#22a55a', 'Plan': '#8b5cf6', 'general-purpose': '#e25d4a', 'code-reviewer': '#0ea5a4', 'statusline-setup': '#64748b' };
const SHIRTS = ['#e25d4a', '#0ea5a4', '#d9468f', '#f08c2e', '#3b82f6', '#84cc16', '#a855f7'];
function shirtFor(type) { return TYPE_SHIRT[type] || SHIRTS[hash(type) % SHIRTS.length]; }

const FRONT = [
  '....HHHH....', '...HHHHHH...', '..HHHHHHHH..', '..HSSSSSSH..', '..SSSSSSSS..', '..SESSSSES..',
  '..SSSSSSSS..', '...SSMMSS...', '....SSSS....', '..CCCCCCCC..', '.CCCCCCCCCC.', '.CCCCCCCCCC.',
  '.SCCCCCCCCS.', '..CCCCCCCC..', '..PPP..PPP..', '..PPP..PPP..',
];
const BACK = [
  '....HHHH....', '...HHHHHH...', '..HHHHHHHH..', '..HHHHHHHH..', '..HHHHHHHH..', '..HHHHHHHH..',
  '..HHHHHHHH..', '...HHHHHH...', '....SSSS....', '..CCCCCCCC..', '.CCCCCCCCCC.', '.CCCCCCCCCC.',
  '.SCCCCCCCCS.', '..CCCCCCCC..', '..PPP..PPP..', '..PPP..PPP..',
];
function sprite({ seed, shirt, back = false, lead = false, px = 3 }) {
  const h = hash(seed);
  const pal = { H: HAIR[h % HAIR.length], S: SKIN[(h >> 4) % SKIN.length], E: '#1b1b1f', M: '#b0605a', C: shirt, P: '#2f3646', L: '#fde047', B: '#f8fafc', W: '#8a5a2b' };
  const rows = (back ? BACK : FRONT).map((r) => r.split(''));
  if (lead) {
    // lanyard + clipboard for the scrum master
    if (!back) { rows[9][5] = 'L'; rows[10][5] = 'L'; rows[10][6] = 'L'; rows[11][6] = 'L'; }
    rows[10][10] = 'W'; rows[11][10] = 'B'; rows[11][11] = 'B'; rows[12][11] = 'B'; rows[12][10] = 'B'; rows[10][11] = 'W';
  }
  let rects = '';
  rows.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`; }));
  return `<svg class="sprite" width="${12 * px}" height="${16 * px}" viewBox="0 0 12 16" shape-rendering="crispEdges">${rects}</svg>`;
}

// ── seating ─────────────────────────────────
// head seat at the left end; three seats along the top, three along the bottom
const HEAD = { x: 44, y: 60 };
const TOP_X = ['36%', '58%', '80%'];
const SEATS = [
  ...TOP_X.map((x) => ({ side: 'top', x, y: 8 })),
  ...TOP_X.map((x) => ({ side: 'bottom', x, y: 108 })),
];
function laptopAt(side, x) {
  return side === 'top' ? `left:${x};top:64px` : `left:${x};top:94px`;
}

// ── rendering ─────────────────────────────────
function issueIndex() {
  const idx = new Map();
  for (const b of state.backlog) for (const i of b.issues) idx.set(`${b.root}#${i.iid}`, i);
  return idx;
}

// Two tags per desk: which agent is running it, and where it is working.
const AGENT_COLOURS = { 'Claude Code': '#d97757', Cowork: '#c2743f', Codex: '#10a37f', Gemini: '#4285f4' };
function agentTag(s) {
  const name = s.agent || 'Agent';
  return `<span class="chip agent" style="--agent:${AGENT_COLOURS[name] || '#8b8f9e'}">${esc(name)}</span>`;
}
function where(s) {
  return s.where || 'local';
}
// How you'd pick this session back up, in its own tool's words
function resumeCommand(s) {
  if (s.beacon) return s.link || null;
  if (s.agent === 'Codex') {
    const uuid = (s.id.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0];
    return uuid ? `codex resume ${uuid}` : 'codex resume --last';
  }
  return `claude --resume ${s.id}`;
}

function renderDormant(s) {
  const gone = s.status === 'ended';
  const note = gone ? 'Session ended' : s.lastAssistant || s.lastPrompt || 'Waiting for your next message';
  const done = (s.tasks || []).filter((t) => t.status === 'completed').length;
  const left = (s.tasks || []).filter((t) => t.status !== 'completed').length;
  return `<div class="dorm ${gone ? 'gone' : ''}" data-id="${esc(s.id)}">
    ${sprite({ seed: s.id, shirt: '#1e3a8a', lead: true, px: 2 })}
    <div class="grow">
      <div class="dorm-head"><b title="${esc(s.title)}">${esc(s.title)}</b>${agentTag(s)}<span class="chip proj">${esc(where(s))}</span><span class="dorm-when">${esc(ago(s.lastActivity))}</span></div>
      <div class="dorm-note">${esc(note)}</div>
    </div>
    <div class="dorm-tasks">${left ? `${left} open` : ''}${left && done ? ' · ' : ''}${done ? `${done} done` : ''}</div>
  </div>`;
}

function renderPod(s, issues) {
  const st = s.status;
  const parked = isParked(s);
  const tasks = s.tasks || [];
  const col = (k) => tasks.filter((t) => t.status === k);
  const colHtml = (k, title) => {
    const list = col(k);
    const shown = k === 'completed' ? list.slice(-3) : list.slice(0, 4);
    const rest = list.length - shown.length;
    return `<div class="col"><h4><span>${title}</span><span>${list.length || ''}</span></h4>${shown
      .map((t) => `<div class="note ${k}" title="${esc(t.subject)}"><span>${esc(k === 'in_progress' && t.activeForm ? t.activeForm : t.subject)}</span></div>`)
      .join('')}${rest > 0 ? `<div class="more">+${rest} more</div>` : ''}</div>`;
  };
  const allRefs = s.issues || [];
  const chips = allRefs
    .slice(0, 3)
    .map((n) => {
      const i = issues.get(`${s.repoRoot}#${n}`);
      return i ? `<a class="chip" href="${esc(i.url)}" target="_blank" rel="noopener" data-stop title="${esc(i.title)}">#${n}</a>` : `<span class="chip" title="Mentioned in this session">#${n}</span>`;
    })
    .join('') + (allRefs.length > 3 ? `<span class="chip" title="${esc(allRefs.slice(3).map((n) => '#' + n).join(' '))}">+${allRefs.length - 3}</span>` : '');
  const board = tasks.length
    ? `<div class="cols">${colHtml('pending', 'To do')}${colHtml('in_progress', 'Doing')}${colHtml('completed', 'Done')}</div>`
    : `<div class="noboard">No task cards yet — ${esc(s.goal ? s.goal.slice(0, 110) : 'waiting for a brief')}</div>`;

  // seats
  const agents = s.agents || [];
  const running = agents.filter((a) => a.status === 'running');
  const finished = agents.filter((a) => a.status !== 'running').reverse();
  const seated = [...running, ...finished].slice(0, SEATS.length);
  const overflow = agents.length - seated.length;
  let seats = '';
  SEATS.forEach((pos, i) => {
    const a = seated[i];
    const cls = a ? (a.status === 'running' ? (st === 'ended' ? '' : 'working') : a.status) : 'vacant';
    seats += `<div class="seat ${pos.side} ${cls}" style="left:${pos.x};top:${pos.y}px" ${a ? `data-tip="${esc(JSON.stringify({ t: `${a.name || a.type}`, d: a.description, a: a.status === 'running' ? a.activity : a.status === 'failed' ? 'Hit a problem' : 'Finished — reported back' }))}"` : ''}>
      <div class="chair"></div>${a ? sprite({ seed: a.id, shirt: shirtFor(a.type), back: pos.side === 'bottom' }) : ''}</div>`;
    if (a) seats += `<div class="laptop ${a.status === 'running' && st !== 'ended' ? 'on' : ''}" style="${laptopAt(pos.side, pos.x)}"></div>`;
  });
  const smWorking = st === 'working';
  const bubble = st === 'needs_you' ? '!' : st === 'your_turn' ? (parked ? 'z' : '?') : st === 'working' ? '···' : 'bye';
  const lead = `<div class="seat head ${smWorking ? 'working' : ''}" style="left:${HEAD.x}px;top:${HEAD.y - 12}px" data-tip="${esc(JSON.stringify({ t: 'Main agent', d: s.goal, a: s.activity || STATUS_LABEL[st] }))}">
      <div class="chair"></div>${st === 'ended' ? '' : sprite({ seed: s.id, shirt: '#1e3a8a', lead: true })}</div>
    <div class="laptop ${smWorking ? 'on' : st === 'needs_you' ? 'alert' : ''}" style="left:96px;top:78px"></div>
    <div class="bubble ${st} ${parked ? 'parked' : ''}">${bubble}</div>`;

  // plate
  let statusText;
  if (st === 'needs_you') statusText = s.waiting ? s.waiting.text : 'Needs you';
  else if (st === 'working') statusText = s.activity || 'Working';
  else if (st === 'your_turn') statusText = parked ? 'Parked — waiting for your next message' : 'Finished its turn — your move';
  else statusText = 'Session ended';
  if (s.beacon && s.stale && st !== 'ended') statusText = `No recent report — last said: ${statusText}`;
  let box = '';
  if (st === 'needs_you' && s.waiting && s.waiting.detail) box = `<div class="waiting-box"><div class="q">${esc(s.waiting.detail)}</div></div>`;
  else if (st === 'your_turn' && !parked && s.lastAssistant) box = `<div class="waiting-box turn"><div class="q">${esc(s.lastAssistant)}</div></div>`;
  const helpers = running.length ? `<span>· ${running.length} helper${running.length > 1 ? 's' : ''} at work</span>` : '';

  return `<div class="pod s-${st}" data-id="${esc(s.id)}">
    <div class="board"><div class="board-head"><div class="board-title" title="${esc(s.title)}">${esc(s.title)}</div>${chips}<div class="sp"></div>${agentTag(s)}<span class="chip proj" title="${esc(s.cwd || '')}">${esc(where(s))}</span></div>${board}</div>
    <div class="desk"><div class="table"></div>${lead}${seats}${overflow > 0 ? `<div class="plus">+${overflow}</div>` : ''}</div>
    <div class="plate">
      <div class="plate-status"><span class="dot ${parked || (s.beacon && s.stale) ? 'ended' : st}"></span><span class="txt">${esc(statusText)}</span></div>
      ${box}
      <div class="plate-meta">${s.branch ? `<code>${esc(s.branch)}</code>` : ''}<span>· ${s.beacon ? 'reported ' : ''}${esc(ago(s.lastActivity))}</span>${helpers}</div>
    </div>
  </div>`;
}

function render() {
  const issues = issueIndex();
  const list = state.sessions;
  // counts
  const n = (k) => list.filter((s) => s.status === k && !(k === 'your_turn' && isParked(s))).length;
  document.getElementById('counts').innerHTML =
    `<span class="count"><span class="dot needs_you"></span>${n('needs_you')} need you</span>` +
    `<span class="count"><span class="dot your_turn"></span>${n('your_turn')} your turn</span>` +
    `<span class="count"><span class="dot working"></span>${n('working')} working</span>`;
  document.getElementById('sub').textContent = state.demo ? 'demo team' : `${list.length} desk${list.length === 1 ? '' : 's'}`;
  document.getElementById('live').innerHTML = state.hooksLive
    ? '<span class="dot working"></span>live'
    : '<span class="dot ended"></span>transcripts';

  // inbox: who is waiting on you, oldest first
  const waiting = list
    .filter((s) => s.status === 'needs_you' || (s.status === 'your_turn' && !isParked(s)))
    .sort((a, b) => (a.status === 'needs_you' ? -1 : 0) - (b.status === 'needs_you' ? -1 : 0) || a.lastActivity - b.lastActivity);
  document.getElementById('inbox').innerHTML = waiting
    .map((s) => {
      const text = s.status === 'needs_you' ? (s.waiting ? s.waiting.text : 'Needs you') : s.lastAssistant || 'Your turn';
      return `<div class="ask ${s.status === 'your_turn' ? 'turn' : ''}" data-open="${esc(s.id)}"><b>${esc(s.title)}</b><span>${esc(text)}</span></div>`;
    })
    .join('');

  // floor: active desks on top, dormant ones below
  const active = list
    .filter((s) => s.status === 'working' || s.status === 'needs_you' || (s.status === 'your_turn' && !isParked(s)))
    .sort((a, b) => ORDER[a.status] - ORDER[b.status] || b.lastActivity - a.lastActivity);
  const dormant = list.filter((s) => !active.includes(s)).sort((a, b) => b.lastActivity - a.lastActivity);

  const floor = document.getElementById('floor');
  if (!list.length) {
    floor.innerHTML = `<div class="empty"><b>The office is quiet</b>No Claude sessions in the last few hours. Start one and a desk will appear.</div>`;
    podCache.clear();
    floor.dataset.shape = '';
  } else {
    const shape = `${active.map((s) => s.id).join('|')}#${dormant.map((s) => s.id).join('|')}`;
    if (floor.dataset.shape !== shape) {
      floor.dataset.shape = shape;
      podCache.clear();
      floor.innerHTML =
        (active.length
          ? `<section class="room"><div class="room-head"><h3>At work</h3><span>${active.length} desk${active.length === 1 ? '' : 's'}</span></div>
             <div class="room-floor">${active.map((s) => `<div data-slot="${esc(s.id)}"></div>`).join('')}</div></section>`
          : `<section class="room"><div class="room-head"><h3>At work</h3><span>nobody right now</span></div></section>`) +
        (dormant.length
          ? `<section class="room dormant"><div class="room-head"><h3>Dormant</h3><span>${dormant.length} desk${dormant.length === 1 ? '' : 's'} idle or finished</span></div>
             <div class="dorm-list">${dormant.map((s) => renderDormant(s)).join('')}</div></section>`
          : '');
    } else {
      const dl = floor.querySelector('.dorm-list');
      if (dl) {
        const html = dormant.map((s) => renderDormant(s)).join('');
        if (dl.dataset.html !== html) {
          dl.dataset.html = html;
          dl.innerHTML = html;
        }
      }
    }
    for (const s of active) {
      const slot = floor.querySelector(`[data-slot="${CSS.escape(s.id)}"]`);
      if (!slot) continue;
      const html = renderPod(s, issues);
      if (podCache.get(s.id) !== html || !slot.firstElementChild) {
        podCache.set(s.id, html);
        slot.innerHTML = html;
      }
    }
  }
  renderBacklog();
  if (openId) renderDrawer();
}

function renderBacklog() {
  const el = document.getElementById('backlog');
  const bySession = new Map(); // root#iid -> sessions
  for (const s of state.sessions) for (const n of s.issues || []) {
    const k = `${s.repoRoot}#${n}`;
    if (!bySession.has(k)) bySession.set(k, []);
    bySession.get(k).push(s);
  }
  let html = `<h2>Backlog <button id="refresh" title="Refresh issues">↻ refresh</button></h2>`;
  if (!state.backlog.length) {
    html += `<div class="repo-err">GitLab issues appear here for each repo a session is working in (via <code>glab</code>).</div>`;
  }
  for (const b of state.backlog) {
    const taken = b.issues.filter((i) => bySession.has(`${b.root}#${i.iid}`));
    const rest = b.issues.filter((i) => !bySession.has(`${b.root}#${i.iid}`));
    html += `<div class="repo"><div class="repo-name"><span>${esc(b.repo)}</span><span>${b.forge ? esc(b.forge) + ' · ' : ''}${b.issues.length}</span></div>`;
    if (b.error) html += `<div class="repo-err">${esc(b.error)}</div>`;
    const card = (i, desk) => {
      const tilt = ((hash(i.iid) % 5) - 2) * 0.5;
      const ss = desk ? bySession.get(`${b.root}#${i.iid}`) : [];
      const top = ss.find((x) => x.status === 'needs_you') || ss.find((x) => x.status === 'working') || ss[0];
      return `<a class="card ${desk ? `taken s-${top.status}` : ''}" style="--tilt:${tilt}deg" href="${esc(i.url)}" target="_blank" rel="noopener">
        <div class="iid">#${i.iid}</div><div class="t">${esc(i.title)}</div>
        ${i.labels && i.labels.length ? `<div class="labels">${i.labels.map((l) => `<span class="label">${esc(l)}</span>`).join('')}</div>` : ''}
        ${desk ? ss.map((x) => `<div class="desk-tag" data-open="${esc(x.id)}"><span class="dot ${x.status}"></span>At desk: ${esc(x.title)}</div>`).join('') : ''}
      </a>`;
    };
    if (taken.length) html += `<div class="subhead">On a desk</div>` + taken.map((i) => card(i, true)).join('');
    if (rest.length) html += `<div class="subhead">Waiting</div>` + rest.map((i) => card(i, false)).join('');
    html += `</div>`;
  }
  if (el.dataset.html !== html) {
    const top = el.scrollTop;
    el.innerHTML = html;
    el.dataset.html = html;
    el.scrollTop = top;
  }
}

function renderDrawer() {
  const s = state.sessions.find((x) => x.id === openId);
  const drawer = document.getElementById('drawer');
  if (!s) { drawer.classList.remove('open'); openId = null; renderFoot(null); return; }
  const issues = issueIndex();
  const parked = isParked(s);
  const head = `<h2>${esc(s.title)}</h2><span class="pill"><span class="dot ${parked ? 'ended' : s.status}"></span>${parked ? 'Parked' : STATUS_LABEL[s.status]}</span><button class="iconbtn" data-close>✕</button>`;
  let body = '';
  if (s.status === 'needs_you' && s.waiting) {
    body += `<div class="sec"><h5>${s.waiting.kind === 'question' ? 'Question for you' : s.waiting.kind === 'plan' ? 'Plan awaiting approval' : 'Waiting for permission'}</h5><div class="quote" style="border-left:3px solid var(--needs)">${esc(s.waiting.text)}${s.waiting.detail ? `<div class="detail">${esc(s.waiting.detail)}</div>` : ''}</div>
      <div class="actions">${!s.beacon ? `<button class="primary" data-reveal="${esc(s.id)}">Open the session</button>` : ''}${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener"><button class="primary">Open the session</button></a>` : ''}${resumeCommand(s) ? `<button data-copy="${esc(resumeCommand(s))}">Copy resume command</button>` : ''}</div>
      <div class="hint">Answer it in the session itself — approvals can only be given where the session is running.</div></div>`;
  }
  if (s.status === 'working' && s.activity) body += `<div class="sec"><h5>Doing right now</h5><div class="quote">${esc(s.activity)}</div></div>`;
  if (s.lastAssistant) body += `<div class="sec"><h5>Latest from Claude</h5><div class="quote">${esc(s.lastAssistant)}</div></div>`;
  if (s.goal) body += `<div class="sec"><h5>The brief (first message)</h5><div class="quote">${esc(s.goal)}</div></div>`;
  if (s.lastPrompt && s.lastPrompt !== s.goal) body += `<div class="sec"><h5>Your latest message</h5><div class="quote">${esc(s.lastPrompt)}</div></div>`;
  if ((s.issues || []).length) {
    body += `<div class="sec"><h5>Tickets</h5>${s.issues
      .map((n) => {
        const i = issues.get(`${s.repoRoot}#${n}`);
        return `<div class="row"><span class="chip">#${n}</span><div class="grow">${i ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : '<small>Mentioned in this session (not in the open backlog)</small>'}</div></div>`;
      })
      .join('')}</div>`;
  }
  body += `<div class="sec"><h5>Team</h5><div class="row"><span class="st running">lead</span><div class="grow"><b>Main agent</b> — runs this session<small>${esc(s.activity || STATUS_LABEL[s.status])}</small></div></div>${(s.agents || [])
    .map((a) => `<div class="row"><span class="st ${a.status}">${esc(a.status)}</span><div class="grow"><b>${esc(a.name || a.type)}</b>${a.background ? ' <small style="display:inline">(background)</small>' : ''} — ${esc(a.description)}<small>${esc(a.status === 'running' ? a.activity || '' : `${a.status === 'failed' ? 'Hit a problem' : 'Reported back'} ${ago(a.endedAt)}`)}</small></div></div>`)
    .join('') || '<small style="color:var(--muted)">No helpers called in yet.</small>'}</div>`;
  if ((s.tasks || []).length) {
    body += `<div class="sec"><h5>Board</h5>${s.tasks.map((t) => `<div class="row"><span class="st ${t.status}">${esc(t.status.replace('_', ' '))}</span><div class="grow">${esc(t.subject)}${t.owner ? `<small>${esc(t.owner)}</small>` : ''}</div></div>`).join('')}</div>`;
  }
  const resume = resumeCommand(s);
  if (resume) body += `<div class="sec"><h5>Pick it up</h5><div class="copy"><code>${esc(resume)}</code><button data-copy="${esc(resume)}">Copy</button></div></div>`;
  body += `<div class="sec"><h5>Details</h5><div class="kv">
    <div>Agent</div><div>${esc(s.agent || '')}</div>
    <div>Where</div><div>${esc(s.where || s.project || '')}</div>
    ${s.branch ? `<div>Branch</div><div><code>${esc(s.branch)}</code></div>` : ''}
    <div>Folder</div><div><code>${esc(s.cwd || '')}</code></div>
    <div>Started</div><div>${esc(ago(s.startedAt))}</div>
    <div>Last activity</div><div>${esc(ago(s.lastActivity))}</div>
    <div>Updates</div><div>${s.beacon ? `Beacon · reported ${esc(ago(s.lastActivity))}` : s.hooked ? 'Live (hooks)' : 'From transcript'}</div>
    ${s.link ? `<div>Open</div><div><a href="${esc(s.link)}" target="_blank" rel="noopener">Open this session</a></div>` : ''}
    <div>Session</div><div><code>${esc(s.id)}</code></div></div></div>`;
  body += `<div class="convo" id="convo"><h5><span>Conversation</span><button data-refresh-convo>Refresh</button></h5><div class="msgs" id="msgs"><div class="msg-empty">Loading…</div></div></div>`;

  const dh = document.getElementById('dhead');
  const db = document.getElementById('dbody');
  if (dh.dataset.html !== head) { dh.innerHTML = head; dh.dataset.html = head; }
  if (db.dataset.html !== body) { db.innerHTML = body; db.dataset.html = body; }
  drawer.classList.add('open');
  renderFoot(s);
  loadConversation(s.id);
}

// ── reply composer ─────────────────────────────────────────────────────────
// Sits outside the drawer body, which is rebuilt on every update and would wipe a half-typed reply
let footFor = null;
const canReply = (s) => state.replies && !s.beacon && s.agent === 'Claude Code' && !!s.cwd;
function renderFoot(s) {
  const foot = document.getElementById('dfoot');
  if (!s || !canReply(s)) { foot.innerHTML = ''; footFor = null; return; }
  if (footFor !== s.id) {
    footFor = s.id;
    foot.innerHTML = `<textarea id="reply" rows="2" placeholder="Reply to this session…"></textarea><div class="foot-row"><span class="hint" id="reply-note"></span><button id="reply-send">Send</button></div>`;
  }
  const note = document.getElementById('reply-note');
  if (note.dataset.sticky) return; // keep the last send's outcome until you type again
  note.classList.remove('err');
  note.textContent =
    s.status === 'working' ? "It's working. Send once it has finished its turn." :
    s.status === 'needs_you' ? 'Approvals are given where it runs, not here.' :
    'Picks the session back up in the background with your message. ⌘↩ sends.';
}
async function sendReply() {
  const id = footFor;
  const box = document.getElementById('reply');
  const btn = document.getElementById('reply-send');
  const note = document.getElementById('reply-note');
  const text = box.value.trim();
  if (!id || !text || btn.disabled) return;
  btn.disabled = true;
  note.dataset.sticky = '1';
  note.classList.remove('err');
  note.textContent = 'Sending…';
  let r;
  try {
    r = await action(`/api/session/${encodeURIComponent(id)}/reply`, { text }).then((x) => x.json());
  } catch {
    r = { ok: false, reason: 'Could not reach the server.' };
  }
  if (footFor !== id) return; // drawer moved on
  btn.disabled = false;
  note.textContent = r.ok ? 'Sent. It picks up in a moment.' : r.reason || 'Not sent.';
  note.classList.toggle('err', !r.ok);
  if (r.ok) box.value = '';
}

// ── conversation panel ─────────────────────────────────────────────────────
let convoFor = null;
let convoSig = '';
async function loadConversation(id, force) {
  const box = document.getElementById('msgs');
  if (!box) return;
  if (convoFor !== id) {
    convoSig = '';
    box.innerHTML = '<div class="msg-empty">Loading…</div>';
  }
  convoFor = id;
  let data;
  try {
    data = await fetch(`/api/session/${encodeURIComponent(id)}/messages`).then((r) => r.json());
  } catch {
    box.innerHTML = '<div class="msg-empty">Could not read this session\'s transcript.</div>';
    return;
  }
  if (convoFor !== id) return; // drawer moved on while we were fetching
  const sig = JSON.stringify(data.messages.map((m) => [m.role, m.ts, m.text.length]));
  if (sig === convoSig && !force) return;
  convoSig = sig;
  if (!data.messages.length) {
    box.innerHTML = `<div class="msg-empty">${esc(data.note || 'Nothing to show yet.')}</div>`;
    return;
  }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = data.messages
    .map((m) => {
      if (m.role === 'tool') return `<div class="msg tool">${esc(m.text)}</div>`;
      return `<div class="msg ${m.role}"><span class="who">${m.role === 'user' ? 'You' : 'Claude'} · ${esc(ago(m.ts))}</span>${esc(m.text)}</div>`;
    })
    .join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// ── interactions ─────────────────────────────────
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-stop]')) return;
  const copy = t.closest('[data-copy]');
  if (copy) { navigator.clipboard?.writeText(copy.dataset.copy); copy.textContent = 'Copied'; setTimeout(() => (copy.textContent = 'Copy'), 1200); return; }
  if (t.closest('[data-close]')) { openId = null; document.getElementById('drawer').classList.remove('open'); return; }
  const opener = t.closest('[data-open]');
  if (opener) { e.preventDefault(); openId = opener.dataset.open; renderDrawer(); return; }
  if (t.id === 'refresh') { action('/api/refresh-backlog'); t.textContent = '↻ …'; return; }
  const rev = t.closest('[data-reveal]');
  if (rev) {
    action(`/api/session/${encodeURIComponent(rev.dataset.reveal)}/reveal`)
      .then((r) => r.json())
      .then((r) => { rev.textContent = r.ok ? 'Opened' : 'Open it yourself — see the folder below'; });
    return;
  }
  if (t.closest('[data-refresh-convo]')) { loadConversation(openId, true); return; }
  if (t.id === 'reply-send') { sendReply(); return; }
  const pod = t.closest('.pod, .dorm');
  if (pod) { openId = pod.dataset.id; renderDrawer(); return; }
  if (!t.closest('.drawer')) { openId = null; document.getElementById('drawer').classList.remove('open'); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'reply' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendReply(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'reply') delete document.getElementById('reply-note').dataset.sticky; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { openId = null; document.getElementById('drawer').classList.remove('open'); } });

const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  try {
    const d = JSON.parse(el.dataset.tip);
    tip.innerHTML = `<b>${esc(d.t)}</b>${d.d ? esc(d.d) + '<br>' : ''}<i>${esc(d.a || '')}</i>`;
  } catch { return; }
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px';
  tip.style.top = e.clientY + 16 + 'px';
});

// theme toggle (remembered per browser)
const root = document.documentElement;
try { const t = localStorage.getItem('ao-theme'); if (t) root.dataset.theme = t; } catch {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('ao-theme', root.dataset.theme); } catch {}
};

// ── data ─────────────────────────────────
function connect() {
  const es = new EventSource('/api/stream');
  es.addEventListener('state', (e) => { state = JSON.parse(e.data); render(); });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
setInterval(render, 20_000); // refresh "x min ago"
setInterval(() => { if (openId) loadConversation(openId); }, 4000);
</script>
</body>
</html>
